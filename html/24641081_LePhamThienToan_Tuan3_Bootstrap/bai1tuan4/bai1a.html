<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
        }

        .container {
            width: 1500px !important;
            max-width: 1500px !important;
            height: 900px !important;
            border: 1px solid #1a1a1a;
            background-color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body class="min-vh-100 d-flex justify-content-center align-items-center m-0 p-0">

<div class="container p-0">
    <div class="row g-0 h-100">

        <!-- CỘT TRÁI: Quầy trái cây sạp hàng (chiếm suốt chiều dọc) -->
        <div class="col-5 h-100">
            <img 
                src="./a-vertical-picture-of-a-single-feather-falling-from-the-sky-free-photo.jpeg" 
                alt="Fruit Market Stand" 
                class="gallery-img"
                onerror="this.src='https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=800&q=80'"
            >
        </div>

        <!-- CỘT PHẢI: Chia theo 2 hàng (Hàng trên 2 ảnh, Hàng dưới 3 ảnh so le) -->
        <div class="col-7 h-100 d-flex flex-column">

            <!-- HÀNG TRÊN (60% chiều cao): Đúng 2 ảnh chia đều -->
            <div class="row g-0" style="height: 60%;">
                <div class="col-6 h-100">
                    <img 
                        src="./pngtree-new-cb-background-images-photos-pics-wallpaper-pictures-image_16123145.jpg" 
                        alt="Raspberries" 
                        class="gallery-img"
                        onerror="this.src='https://images.unsplash.com/photo-1577069808021-51206f4e7c75?auto=format&fit=crop&w=600&q=80'"
                    >
                </div>
                <div class="col-6 h-100">
                    <img 
                        src="./smiling-young-woman-holding-retro-camera_329181-142.avif" 
                        alt="Apples on tree" 
                        class="gallery-img"
                        onerror="this.src='https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=800&q=80'"
                    >
                </div>
            </div>

            <!-- HÀNG DƯỚI (40% chiều cao): 3 ảnh, ảnh thứ 2 (col-4) nằm chính giữa chia đều ranh giới 2 ảnh trên -->
            <div class="row g-0" style="height: 40%;">
                <div class="col-4 h-100">
                    <img 
                        src="./phonepicutres-TA.webp" 
                        alt="Lemons on tree" 
                        class="gallery-img"
                        onerror="this.src='https://images.unsplash.com/photo-1534856966150-c832f7b7f095?auto=format&fit=crop&w=600&q=80'"
                    >
                </div>
                <div class="col-4 h-100">
                    <img 
                        src="./pngtree-new-cb-background-images-photos-pics-wallpaper-pictures-image_16123145.jpg" 
                        alt="People dining outdoors" 
                        class="gallery-img"
                        onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=400&q=80'"
                    >
                </div>
                <div class="col-4 h-100">
                    <img 
                        src="./phonepicutres-TA.webp" 
                        alt="Cherries in basket" 
                        class="gallery-img"
                        onerror="this.src='https://images.unsplash.com/photo-1528825871115-3581a5387919?auto=format&fit=crop&w=400&q=80'"
                    >
                </div>
            </div>

        </div>

    </div>
</div>

</body>
</html>
