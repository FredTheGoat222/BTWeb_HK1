<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Table with Images, Badges, and Hover</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f5f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .card-table-wrapper {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            padding: 24px;
            width: 100%;
            max-width: 960px;
        }

        .user-avatar {
            width: 46px;
            height: 46px;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Pill badge style */
        .badge-subtle-success {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .badge-subtle-primary {
            background-color: #cfe2ff;
            color: #084298;
        }

        .badge-subtle-warning {
            background-color: #fff3cd;
            color: #664d03;
        }

        .btn-edit {
            color: #2b6cb0;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            padding: 4px 8px;
        }

        .btn-edit:hover {
            color: #1a4971;
            text-decoration: underline;
        }
    </style>
</head>
<body class="min-vh-100 d-flex justify-content-center align-items-center p-3">

<div class="card-table-wrapper">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th scope="col" class="border-0 text-secondary fw-semibold py-3 ps-3">Name</th>
                    <th scope="col" class="border-0 text-secondary fw-semibold py-3">Title</th>
                    <th scope="col" class="border-0 text-secondary fw-semibold py-3 text-center">Status</th>
                    <th scope="col" class="border-0 text-secondary fw-semibold py-3">Position</th>
                    <th scope="col" class="border-0 text-secondary fw-semibold py-3 text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Row 1: John Doe -->
                <tr>
                    <td class="ps-3 py-3">
                        <div class="d-flex align-items-center gap-3">
                            <img 
                                src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80" 
                                alt="John Doe" 
                                class="user-avatar"
                            >
                            <div>
                                <p class="fw-bold mb-0 text-dark">John Doe</p>
                                <p class="text-secondary small mb-0">john.doe@gmail.com</p>
                            </div>
                        </div>
                    </td>
                    <td>
                        <p class="fw-normal mb-0 text-dark">Software engineer</p>
                        <p class="text-secondary small mb-0">IT department</p>
                    </td>
                    <td class="text-center">
                        <span class="badge rounded-pill badge-subtle-success px-3 py-2 fw-medium">Active</span>
                    </td>
                    <td class="text-secondary">
                        Senior
                    </td>
                    <td class="text-center">
                        <button type="button" class="btn btn-link btn-edit">EDIT</button>
                    </td>
                </tr>

                <!-- Row 2: Alex Ray -->
                <tr>
                    <td class="ps-3 py-3">
                        <div class="d-flex align-items-center gap-3">
                            <img 
                                src="https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=120&q=80" 
                                alt="Alex Ray" 
                                class="user-avatar"
                            >
                            <div>
                                <p class="fw-bold mb-0 text-dark">Alex Ray</p>
                                <p class="text-secondary small mb-0">alex.ray@gmail.com</p>
                            </div>
                        </div>
                    </td>
                    <td>
                        <p class="fw-normal mb-0 text-dark">Consultant</p>
                        <p class="text-secondary small mb-0">Finance</p>
                    </td>
                    <td class="text-center">
                        <span class="badge rounded-pill badge-subtle-primary px-3 py-2 fw-medium">Onboarding</span>
                    </td>
                    <td class="text-secondary">
                        Junior
                    </td>
                    <td class="text-center">
                        <button type="button" class="btn btn-link btn-edit">EDIT</button>
                    </td>
                </tr>

                <!-- Row 3: Kate Hunington -->
                <tr>
                    <td class="ps-3 py-3">
                        <div class="d-flex align-items-center gap-3">
                            <img 
                                src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=120&q=80" 
                                alt="Kate Hunington" 
                                class="user-avatar"
                            >
                            <div>
                                <p class="fw-bold mb-0 text-dark">Kate Hunington</p>
                                <p class="text-secondary small mb-0">kate.hunington@gmail.com</p>
                            </div>
                        </div>
                    </td>
                    <td>
                        <p class="fw-normal mb-0 text-dark">Designer</p>
                        <p class="text-secondary small mb-0">UI/UX</p>
                    </td>
                    <td class="text-center">
                        <span class="badge rounded-pill badge-subtle-warning px-3 py-2 fw-medium">Awaiting</span>
                    </td>
                    <td class="text-secondary">
                        Senior
                    </td>
                    <td class="text-center">
                        <button type="button" class="btn btn-link btn-edit">EDIT</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
