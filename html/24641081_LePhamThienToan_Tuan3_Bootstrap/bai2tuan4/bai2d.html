<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .form-card-wrapper {
            width: 100%;
            max-width: 680px;
            background-color: #ffffff;
            border: 1.5px solid #6cb2eb;
            padding: 24px 28px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .form-label-custom {
            font-size: 14px;
            font-weight: 500;
            color: #333333;
            margin-bottom: 6px;
        }

        .form-control-custom {
            height: 38px;
            font-size: 14px;
            border-radius: 4px;
        }

        .input-group-text-custom {
            background-color: #e9ecef;
            color: #495057;
            font-size: 14px;
        }

        .valid-feedback,
        .invalid-feedback {
            font-size: 12.5px;
            margin-top: 4px;
        }

        .btn-submit-custom {
            background-color: #007bff;
            border-color: #007bff;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            padding: 7px 16px;
            border-radius: 4px;
        }

        .btn-submit-custom:hover {
            background-color: #0069d9;
            border-color: #0062cc;
        }
    </style>
</head>
<body class="min-vh-100 d-flex justify-content-center align-items-center p-3">

<div class="form-card-wrapper">
    <form class="row g-3 needs-validation was-validated" novalidate>
        
        <!-- First name (Hợp lệ) -->
        <div class="col-md-4">
            <label for="validationCustom01" class="form-label form-label-custom">First name</label>
            <input type="text" class="form-control form-control-custom is-valid" id="validationCustom01" value="Mark" required>
            <div class="valid-feedback">
                Looks good!
            </div>
        </div>

        <!-- Last name (Hợp lệ) -->
        <div class="col-md-4">
            <label for="validationCustom02" class="form-label form-label-custom">Last name</label>
            <input type="text" class="form-control form-control-custom is-valid" id="validationCustom02" value="Otto" required>
            <div class="valid-feedback">
                Looks good!
            </div>
        </div>

        <!-- Username (Không hợp lệ) -->
        <div class="col-md-4">
            <label for="validationCustomUsername" class="form-label form-label-custom">Username</label>
            <div class="input-group has-validation">
                <span class="input-group-text input-group-text-custom">@</span>
                <input type="text" class="form-control form-control-custom is-invalid" id="validationCustomUsername" placeholder="Username" required>
                <div class="invalid-feedback">
                    Please choose a username.
                </div>
            </div>
        </div>

        <!-- City (Không hợp lệ) -->
        <div class="col-md-6">
            <label for="validationCustom03" class="form-label form-label-custom">City</label>
            <input type="text" class="form-control form-control-custom is-invalid" id="validationCustom03" placeholder="City" required>
            <div class="invalid-feedback">
                Please provide a valid city.
            </div>
        </div>

        <!-- State (Không hợp lệ) -->
        <div class="col-md-3">
            <label for="validationCustom04" class="form-label form-label-custom">State</label>
            <input type="text" class="form-control form-control-custom is-invalid" id="validationCustom04" placeholder="State" required>
            <div class="invalid-feedback">
                Please provide a valid state.
            </div>
        </div>

        <!-- Zip (Không hợp lệ) -->
        <div class="col-md-3">
            <label for="validationCustom05" class="form-label form-label-custom">Zip</label>
            <input type="text" class="form-control form-control-custom is-invalid" id="validationCustom05" placeholder="Zip" required>
            <div class="invalid-feedback">
                Please provide a valid zip.
            </div>
        </div>

        <!-- Checkbox Điều khoản (Không hợp lệ) -->
        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input is-invalid" type="checkbox" value="" id="invalidCheck" required>
                <label class="form-check-label text-danger" for="invalidCheck">
                    Agree to terms and conditions
                </label>
                <div class="invalid-feedback">
                    You must agree before submitting.
                </div>
            </div>
        </div>

        <!-- Nút Submit -->
        <div class="col-12 pt-2">
            <button class="btn btn-submit-custom" type="submit">Submit form</button>
        </div>

    </form>
</div>

<script>
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

</body>
</html>
