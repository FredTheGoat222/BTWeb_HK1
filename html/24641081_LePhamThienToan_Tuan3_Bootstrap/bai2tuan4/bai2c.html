<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f8fafc;
            font-family: Arial, Helvetica, sans-serif;
        }

        .form-container {
            width: 100%;
            max-width: 680px;
            background-color: #ffffff;
            border: 1.5px solid #6cb2eb;
            padding: 24px 28px 28px 28px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }

        .custom-label {
            font-size: 14px;
            color: #4a5568;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .custom-input {
            height: 38px;
            font-size: 13.5px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            color: #495057;
            padding: 6px 12px;
        }

        .custom-input::placeholder {
            color: #8c98a4;
            font-size: 13px;
        }

        .custom-input:focus {
            border-color: #6cb2eb;
            box-shadow: 0 0 0 2px rgba(108, 178, 235, 0.25);
        }

        .form-check-label {
            font-size: 13.5px;
            color: #4a5568;
        }

        .btn-signup-teal {
            background-color: #17a2b8;
            border-color: #17a2b8;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 18px;
            border-radius: 3px;
        }

        .btn-signup-teal:hover {
            background-color: #138496;
            border-color: #117a8b;
            color: #ffffff;
        }

        .btn-facebook {
            background-color: #007bff;
            border-color: #007bff;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 18px;
            border-radius: 3px;
        }

        .btn-facebook:hover {
            background-color: #0069d9;
            border-color: #0062cc;
            color: #ffffff;
        }

        .text-separator {
            font-size: 13.5px;
            color: #6c757d;
        }
    </style>
</head>
<body class="min-vh-100 d-flex justify-content-center align-items-center p-3">

<div class="form-container">
    <form action="#" method="post" onsubmit="return false;">
        <div class="row g-3">

            <!-- Cột trái: Username -->
            <div class="col-md-6">
                <label class="form-label custom-label">Username*</label>
                <input type="text" class="form-control custom-input" placeholder="Choose your username" required>
            </div>

            <!-- Cột phải: Company name -->
            <div class="col-md-6">
                <label class="form-label custom-label">Company name*</label>
                <input type="text" class="form-control custom-input" placeholder="your company name">
            </div>

            <!-- Cột trái: E-mail -->
            <div class="col-md-6">
                <label class="form-label custom-label">E-mail*</label>
                <input type="email" class="form-control custom-input" placeholder="Your current email address" required>
            </div>

            <!-- Cột phải: Category -->
            <div class="col-md-6">
                <label class="form-label custom-label">Category*</label>
                <input type="text" class="form-control custom-input" placeholder="skills catagory">
            </div>

            <!-- Cột trái: Password -->
            <div class="col-md-6">
                <label class="form-label custom-label">Password*</label>
                <input type="password" class="form-control custom-input" placeholder="Create a password" required>
            </div>

            <!-- Cột phải: Contact number -->
            <div class="col-md-6">
                <label class="form-label custom-label">Contact number*</label>
                <input type="tel" class="form-control custom-input" placeholder="provide your number">
            </div>

            <!-- Cột trái: Full name -->
            <div class="col-md-6">
                <label class="form-label custom-label">Full name*</label>
                <input type="text" class="form-control custom-input" placeholder="Your Frist name and Last name" required>
            </div>

            <!-- Cột phải: Your Location -->
            <div class="col-md-6">
                <label class="form-label custom-label">Your Location*</label>
                <input type="text" class="form-control custom-input" placeholder="Your Pincode and City">
            </div>

            <!-- Cột trái: Gender -->
            <div class="col-md-6">
                <label class="form-label custom-label d-block mb-1">Gender*</label>
                <div class="d-flex align-items-center gap-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                        <label class="form-check-label" for="genderMale">Male</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                        <label class="form-check-label" for="genderFemale">Female</label>
                    </div>
                </div>
            </div>

            <!-- Cột phải: Terms & Conditions Checkbox -->
            <div class="col-md-6 d-flex align-items-center pt-md-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="termsCheck" required>
                    <label class="form-check-label" for="termsCheck">
                        Agree with the terms and conditions
                    </label>
                </div>
            </div>

            <!-- Hàng nút bấm căn phải -->
            <div class="col-12 text-end pt-3">
                <div class="d-inline-flex align-items-center gap-2">
                    <button type="submit" class="btn btn-signup-teal">Signup</button>
                    <span class="text-separator">or</span>
                    <button type="button" class="btn btn-facebook">Sign Up with Facebook</button>
                </div>
            </div>

        </div>
    </form>
</div>

</body>
</html>
