<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Modal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f8fafc;
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
        }

        .btn-trigger-login {
            background-color: #0b5ed7;
            color: #ffffff;
            font-weight: 500;
            padding: 6px 18px;
            border-radius: 4px;
            border: none;
        }

        .modal-content {
            border-radius: 6px;
            border: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .modal-title {
            font-size: 22px;
            color: #333333;
            font-weight: 500;
        }

        .modal-body {
            padding: 20px;
        }

        .custom-label {
            font-size: 14px;
            color: #333333;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .custom-input {
            height: 38px;
            font-size: 14px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }

        .custom-input::placeholder {
            color: #8c98a4;
        }

        .btn-submit {
            background-color: #0d6efd;
            border-color: #0d6efd;
            color: #ffffff;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 4px;
        }

        .btn-submit:hover {
            background-color: #0b5ed7;
        }

        .modal-footer {
            padding: 12px 20px;
            border-top: 1px solid #e9ecef;
        }

        .btn-close-modal {
            background-color: #dc3545;
            border-color: #dc3545;
            color: #ffffff;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 4px;
        }

        .btn-close-modal:hover {
            background-color: #bb2d3b;
        }
    </style>
</head>
<body>

    <!-- Nút bấm mở Modal -->
    <button type="button" class="btn btn-trigger-login" data-bs-toggle="modal" data-bs-target="#loginModal">
        Login
    </button>

    <!-- Hộp thoại Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form action="#" method="post" onsubmit="return false;">
                        <div class="mb-3">
                            <label class="form-label custom-label">Email</label>
                            <input type="email" class="form-control custom-input" placeholder="Email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label custom-label">Password</label>
                            <input type="password" class="form-control custom-input" placeholder="Password" required>
                        </div>
                        <div>
                            <button type="submit" class="btn btn-submit">Submit</button>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-close-modal" data-bs-dismiss="modal">Close</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
            loginModal.show();
        });
    </script>

</body>
</html>
